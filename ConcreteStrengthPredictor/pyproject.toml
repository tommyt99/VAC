[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concrete-strength-predictor"
version = "0.1.0"
description = "Leakage-safe concrete compressive-strength prediction with grouped validation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tommy Tran" }]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
app = [
  "plotly>=5.24,<7",
  "streamlit>=1.51,<2",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
concrete-strength = "concrete_strength.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concrete_strength = ["sources.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
